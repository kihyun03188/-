<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101426">
<title>테트리스</title>
<style>
:root{color-scheme:dark;--bg:#0c1020;--panel:#171d34;--panel2:#202945;--line:#34405f;--text:#f2f4ff;--muted:#a5afca;--accent:#9b8cff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:20px;background:radial-gradient(ellipse at 50% -15%,#31335e 0%,#171b33 38%,var(--bg) 78%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;align-items:center}
main{width:min(760px,100%)}
header{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:15px}
h1{margin:0;font-size:clamp(28px,5vw,40px);letter-spacing:-1.2px}
.subtitle{color:var(--muted);font-size:13px;margin-top:4px}
.top-stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{min-width:75px;padding:8px 11px;background:#1b2340;border:1px solid var(--line);border-radius:12px}
.stat small{display:block;color:var(--muted);font-size:11px}
.stat strong{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:13px;align-items:start}
.board-wrap{position:relative;padding:10px;background:#0c1121;border:1px solid #394263;border-radius:17px;box-shadow:0 22px 65px #0008}
#board{display:block;width:100%;height:auto;aspect-ratio:1/2;border-radius:8px;background:#10172b}
.overlay{position:absolute;inset:10px;border-radius:8px;background:#080d1bdc;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px}
.overlay.hidden{display:none}
.dialog{max-width:320px}
.dialog .emoji{font-size:42px;margin-bottom:5px}
.dialog h2{font-size:28px;margin:0 0 7px}
.dialog p{color:#c0c7dc;line-height:1.65;font-size:14px;margin:0 0 17px}
button{border:0;border-radius:11px;padding:11px 16px;font:inherit;font-weight:750;cursor:pointer;background:var(--accent);color:#111326;transition:filter .15s,transform .15s;touch-action:manipulation}
button:hover{filter:brightness(1.1)}button:active{transform:scale(.96)}
button:focus-visible{outline:3px solid white;outline-offset:3px}
.side{display:flex;flex-direction:column;gap:10px}
.panel{background:#171f37;border:1px solid var(--line);border-radius:13px;padding:12px}
.panel h2{margin:0 0 9px;font-size:13px;color:#c5cbe0;letter-spacing:.3px}
.preview{display:block;width:100%;height:auto;max-height:115px;object-fit:contain}
.side-stat{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px;padding:4px 0}
.side-stat strong{color:var(--text);font-variant-numeric:tabular-nums}
.side button{width:100%}
.secondary{background:#2a3655;color:#eff1ff}
.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:13px}
.hint{font-size:12px;line-height:1.65;color:var(--muted)}
.mobile-controls{display:none;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,42px);gap:5px}
.mobile-controls button{padding:0;background:#283453;color:#f5f3ff;font-size:18px}
.mobile-controls .rotate{grid-column:2;grid-row:1}
.mobile-controls .left{grid-column:1;grid-row:2}.mobile-controls .down{grid-column:2;grid-row:2}.mobile-controls .right{grid-column:3;grid-row:2}
@media(max-width:620px){
 body{padding:12px;align-items:flex-start}
 header{margin-bottom:10px}
 .layout{grid-template-columns:minmax(0,1fr) 112px;gap:8px}
 .board-wrap{padding:6px;border-radius:13px}.overlay{inset:6px}
 .panel{padding:9px}.panel h2{font-size:12px}.stat{min-width:66px;padding:6px 8px}.stat strong{font-size:17px}
 .preview{max-height:78px}
 .side{gap:7px}
 .side-stat{font-size:11px}
 .side button{padding:9px 5px;font-size:12px}
 .mobile-controls{display:grid}
 .controls{align-items:flex-start}
 .hint{max-width:190px}
}
@media(max-width:390px){.layout{grid-template-columns:minmax(0,1fr) 96px}.stat{min-width:58px}.stat strong{font-size:15px}}
</style>
</head>
<body>
<main>
<header>
 <div><h1>🟪 테트리스</h1><div class="subtitle">블록을 쌓고 줄을 완성해 최고 기록에 도전하세요!</div></div>
 <div class="top-stats">
  <div class="stat"><small>점수</small><strong id="score">0</strong></div>
  <div class="stat"><small>최고 점수</small><strong id="best">0</strong></div>
  <div class="stat"><small>레벨</small><strong id="level">1</strong></div>
 </div>
</header>
<section class="layout">
 <div class="board-wrap">
  <canvas id="board" width="300" height="600" aria-label="테트리스 게임판"></canvas>
  <div class="overlay" id="overlay">
   <div class="dialog"><div class="emoji" id="emoji">🟪</div><h2 id="overlayTitle">테트리스</h2>
    <p id="overlayText">방향키로 블록을 움직이고 위쪽 방향키로 회전하세요.<br>한 줄을 꽉 채우면 줄이 사라집니다!</p>
    <button id="start">게임 시작</button>
   </div>
  </div>
 </div>
 <aside class="side">
  <div class="panel"><h2>다음 블록</h2><canvas id="next" class="preview" width="140" height="110"></canvas></div>
  <div class="panel"><h2>게임 정보</h2>
   <div class="side-stat"><span>제거한 줄</span><strong id="lines">0</strong></div>
   <div class="side-stat"><span>최고 레벨</span><strong id="levelInfo">1</strong></div>
  </div>
  <div class="panel"><h2>조작 방법</h2>
   <div class="hint">← → 이동<br>↓ 빠르게 내리기<br>↑ 회전<br>Space 즉시 떨어뜨리기<br>P 일시정지</div>
  </div>
  <button class="secondary" id="pause">일시정지</button>
  <button class="secondary" id="restart">다시 시작</button>
 </aside>
</section>
<div class="controls">
 <div class="hint">모바일에서는 아래 버튼으로 조작할 수 있어요.<br>블록이 바닥에 닿으면 자동으로 고정됩니다.</div>
 <div class="mobile-controls" aria-label="모바일 게임 조작">
  <button class="rotate" data-action="rotate" aria-label="회전">↻</button>
  <button class="left" data-action="left" aria-label="왼쪽">◀</button>
  <button class="down" data-action="down" aria-label="아래">▼</button>
  <button class="right" data-action="right" aria-label="오른쪽">▶</button>
 </div>
</div>
</main>
<script>
(()=>{
'use strict';
const COLS=10,ROWS=20,CELL=30;
const canvas=document.getElementById('board'),ctx=canvas.getContext('2d');
const nextCanvas=document.getElementById('next'),nctx=nextCanvas.getContext('2d');
const $=id=>document.getElementById(id);
const COLORS={I:'#51dce8',O:'#f4d35e',T:'#b58cff',S:'#62d69b',Z:'#ff718a',J:'#6796ff',L:'#ffa65e'};
const SHAPES={
 I:[[1,1,1,1]],
 O:[[1,1],[1,1]],
 T:[[0,1,0],[1,1,1]],
 S:[[0,1,1],[1,1,0]],
 Z:[[1,1,0],[0,1,1]],
 J:[[1,0,0],[1,1,1]],
 L:[[0,0,1],[1,1,1]]
};
let grid=[],piece=null,nextType=null,score=0,lines=0,level=1,best=0;
let running=false,paused=false,gameEnded=false,lastTime=0,dropTimer=0,dropInterval=850,raf=0;
let softDrop=false;
try{best=Number(localStorage.getItem('tetrisBest')||0)||0}catch(_){}
$('best').textContent=best;
function newGrid(){return Array.from({length:ROWS},()=>Array(COLS).fill(null))}
function randomType(){const types=Object.keys(SHAPES);return types[Math.floor(Math.random()*types.length)]}
function cloneShape(shape){return shape.map(row=>row.slice())}
function makePiece(type){const shape=cloneShape(SHAPES[type]);return {type,shape,x:Math.floor((COLS-shape[0].length)/2),y:0}}
function updateHud(){
 $('score').textContent=score.toLocaleString('ko-KR');$('best').textContent=best.toLocaleString('ko-KR');
 $('level').textContent=level;$('lines').textContent=lines;$('levelInfo').textContent=level;
}
function reset(){
 grid=newGrid();score=0;lines=0;level=1;dropInterval=850;dropTimer=0;softDrop=false;
 nextType=randomType();spawn();updateHud();draw();
}
function spawn(){
 piece=makePiece(nextType||randomType());nextType=randomType();drawNext();
 if(collides(piece,0,0,piece.shape)){finish()}
}
function collides(p,dx,dy,shape){
 for(let y=0;y<shape.length;y++)for(let x=0;x<shape[y].length;x++)if(shape[y][x]){
  const nx=p.x+x+dx,ny=p.y+y+dy;
  if(nx<0||nx>=COLS||ny>=ROWS)return true;
  if(ny>=0&&grid[ny][nx])return true;
 }
 return false;
}
function move(dx,dy){
 if(!running||paused||!piece)return false;
 if(!collides(piece,dx,dy,piece.shape)){piece.x+=dx;piece.y+=dy;return true}
 return false;
}
function rotate(){
 if(!running||paused||!piece)return;
 const old=piece.shape,rotated=old[0].map((_,i)=>old.map(row=>row[i]).reverse());
 // Small wall kicks keep rotations usable near the board edges.
 for(const kick of [0,-1,1,-2,2]){
  if(!collides(piece,kick,0,rotated)){piece.x+=kick;piece.shape=rotated;draw();return}
 }
}
function lockPiece(){
 for(let y=0;y<piece.shape.length;y++)for(let x=0;x<piece.shape[y].length;x++)if(piece.shape[y][x]){
  const gy=piece.y+y,gx=piece.x+x;
  if(gy<0){finish();return}
  grid[gy][gx]=piece.type;
 }
 clearLines();spawn();
}
function clearLines(){
 let cleared=0;
 for(let y=ROWS-1;y>=0;y--){
  if(grid[y].every(cell=>cell!==null)){grid.splice(y,1);grid.unshift(Array(COLS).fill(null));cleared++;y++}
 }
 if(cleared){
  const points=[0,100,300,500,800][cleared]||cleared*200;
  score+=points*level;lines+=cleared;
  level=Math.floor(lines/10)+1;dropInterval=Math.max(95,850-(level-1)*65);
  if(score>best){best=score;try{localStorage.setItem('tetrisBest',String(best))}catch(_){}}
  updateHud();
 }
}
function hardDrop(){
 if(!running||paused||!piece)return;
 let distance=0;while(!collides(piece,0,1,piece.shape)){piece.y++;distance++}
 score+=distance*2;updateHud();lockPiece();draw();
}
function finish(){
 running=false;gameEnded=true;cancelAnimationFrame(raf);$('pause').textContent='일시정지';
 $('emoji').textContent='💫';$('overlayTitle').textContent='게임 오버';
 $('overlayText').innerHTML='최종 점수: <b>'+score.toLocaleString('ko-KR')+'점</b><br>최고 기록에 다시 도전해 보세요!';
 $('start').textContent='다시 플레이';$('overlay').classList.remove('hidden');
}
function showPause(){
 $('emoji').textContent='⏸️';$('overlayTitle').textContent='일시정지';
 $('overlayText').textContent='잠시 쉬어 가세요. 준비되면 계속하기를 눌러 주세요.';
 $('start').textContent='계속하기';$('overlay').classList.remove('hidden');
}
function hideOverlay(){$('overlay').classList.add('hidden')}
function start(){
 reset();running=true;paused=false;gameEnded=false;$('pause').textContent='일시정지';hideOverlay();
 lastTime=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
}
function resume(){
 paused=false;running=true;$('pause').textContent='일시정지';hideOverlay();lastTime=performance.now();raf=requestAnimationFrame(loop);
}
function togglePause(){
 if(!running)return;
 if(paused){resume();return}
 paused=true;cancelAnimationFrame(raf);$('pause').textContent='계속하기';showPause();
}
function loop(now){
 if(!running||paused)return;
 const delta=Math.min(now-lastTime,100);lastTime=now;dropTimer+=delta;
 const interval=softDrop?Math.max(35,dropInterval/14):dropInterval;
 if(dropTimer>=interval){
  dropTimer=0;
  if(move(0,1)){if(softDrop){score+=1;updateHud()}}
  else lockPiece();
 }
 draw();if(running&&!paused)raf=requestAnimationFrame(loop);
}
function block(ctx2,x,y,size,color,alpha=1){
 ctx2.globalAlpha=alpha;ctx2.fillStyle=color;ctx2.fillRect(x+1,y+1,size-2,size-2);
 ctx2.fillStyle='rgba(255,255,255,.2)';ctx2.fillRect(x+3,y+3,size-6,3);ctx2.fillRect(x+3,y+3,3,size-6);
 ctx2.fillStyle='rgba(0,0,0,.18)';ctx2.fillRect(x+3,y+size-6,size-6,3);ctx2.fillRect(x+size-6,y+3,3,size-6);ctx2.globalAlpha=1;
}
function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#10172b';ctx.fillRect(0,0,300,600);
 ctx.strokeStyle='rgba(155,170,215,.09)';ctx.lineWidth=1;
 for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*CELL+.5,0);ctx.lineTo(x*CELL+.5,600);ctx.stroke()}
 for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*CELL+.5);ctx.lineTo(300,y*CELL+.5);ctx.stroke()}
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(grid[y][x])block(ctx,x*CELL,y*CELL,CELL,COLORS[grid[y][x]]);
 if(piece){
  // Ghost piece shows where the active block will land.
  let ghostY=piece.y;while(!collides({...piece,y:ghostY},0,1,piece.shape))ghostY++;
  for(let y=0;y<piece.shape.length;y++)for(let x=0;x<piece.shape[y].length;x++)if(piece.shape[y][x]){
   const gx=piece.x+x,gy=ghostY+y;if(gy>=0)block(ctx,gx*CELL,gy*CELL,CELL,COLORS[piece.type],.2);
  }
  for(let y=0;y<piece.shape.length;y++)for(let x=0;x<piece.shape[y].length;x++)if(piece.shape[y][x]){
   const gy=piece.y+y;if(gy>=0)block(ctx,(piece.x+x)*CELL,gy*CELL,CELL,COLORS[piece.type]);
  }
 }
}
function drawNext(){
 nctx.clearRect(0,0,nextCanvas.width,nextCanvas.height);
 if(!nextType)return;
 const shape=SHAPES[nextType],size=23,w=shape[0].length*size,h=shape.length*size;
 const ox=(nextCanvas.width-w)/2,oy=(nextCanvas.height-h)/2;
 for(let y=0;y<shape.length;y++)for(let x=0;x<shape[y].length;x++)if(shape[y][x])block(nctx,ox+x*size,oy+y*size,size,COLORS[nextType]);
}
function action(name){
 if(name==='left')move(-1,0);else if(name==='right')move(1,0);else if(name==='down'){if(move(0,1)){score+=1;updateHud()}else lockPiece()}
 else if(name==='rotate')rotate();draw();
}
document.addEventListener('keydown',e=>{
 const handled=['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' ','Spacebar','KeyP','p','P'];
 if(handled.includes(e.key)||e.code==='Space'||e.code==='KeyP')e.preventDefault();
 if(e.code==='KeyP'||e.key==='p'||e.key==='P'){togglePause();return}
 if(!running||paused)return;
 if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')action('left');
 else if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')action('right');
 else if(e.key==='ArrowDown'||e.key==='s'||e.key==='S')softDrop=true;
 else if(e.key==='ArrowUp'||e.key==='w'||e.key==='W'||e.key==='x'||e.key==='X')action('rotate');
 else if(e.code==='Space')hardDrop();
});
document.addEventListener('keyup',e=>{if(e.key==='ArrowDown'||e.key==='s'||e.key==='S')softDrop=false});
document.querySelectorAll('[data-action]').forEach(btn=>{
 const name=btn.dataset.action;
 btn.addEventListener('pointerdown',e=>{e.preventDefault();if(name==='down'){softDrop=true;action('down')}else action(name)});
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,()=>{if(name==='down')softDrop=false}));
});
$('start').addEventListener('click',()=>{if(paused&&!gameEnded)resume();else start()});
$('pause').addEventListener('click',togglePause);
$('restart').addEventListener('click',start);
reset();draw();
})();
</script>
</body>
</html>
